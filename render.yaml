services:
  - type: web
    name: ai-stock-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    rootDir: backend
    envVars:
      - key: DEBUG
        value: "False"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]' # Update this after frontend is deployed

  - type: web
    name: ai-stock-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ai-stock-backend
          type: web
          property: host
