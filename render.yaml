services:
  - type: web
    name: ai-stock-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    pythonVersion: 3.10
    envVars:
      - key: DEBUG
        value: "False"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://stellar-signal-ai.vercel.app", "https://signal-ai.vercel.app"]'
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
